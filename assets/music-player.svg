          <animate attributeName="y" values="82;62;82" dur="0.70s" begin="0.25s" repeatCount="indefinite"/>
        </rect>
        
        <rect x="685" y="74" width="6" height="18" rx="3" fill="url(#eqGrad)">
          <animate attributeName="height" values="18;38;18" dur="0.64s" begin="0.05s" repeatCount="indefinite"/>
          <animate attributeName="y" values="74;54;74" dur="0.64s" begin="0.05s" repeatCount="indefinite"/>
        </rect>
        
        <rect x="696" y="84" width="6" height="8" rx="3" fill="url(#eqGrad)">
          <animate attributeName="height" values="8;28;8" dur="0.80s" begin="0.20s" repeatCount="indefinite"/>
          <animate attributeName="y" values="84;64;84" dur="0.80s" begin="0.20s" repeatCount="indefinite"/>
        </rect>
        
        <rect x="707" y="80" width="6" height="12" rx="3" fill="url(#eqGrad)">
          <animate attributeName="height" values="12;32;12" dur="0.68s" begin="0.35s" repeatCount="indefinite"/>
          <animate attributeName="y" values="80;60;80" dur="0.68s" begin="0.35s" repeatCount="indefinite"/>
        </rect>
        
        <rect x="718" y="86" width="6" height="6" rx="3" fill="url(#eqGrad)">
          <animate attributeName="height" values="6;24;6" dur="0.76s" begin="0.12s" repeatCount="indefinite"/>
          <animate attributeName="y" values="86;68;86" dur="0.76s" begin="0.12s" repeatCount="indefinite"/>
        </rect>
        
        <rect x="729" y="82" width="6" height="10" rx="3" fill="url(#eqGrad)">
          <animate attributeName="height" values="10;20;10" dur="0.88s" begin="0.28s" repeatCount="indefinite"/>
          <animate attributeName="y" values="82;72;82" dur="0.88s" begin="0.28s" repeatCount="indefinite"/>
        </rect>
        

  <!-- Kawaii Play Button Pill -->
  <g transform="translate(772, 43)">
    <rect x="0" y="0" width="90" height="50" rx="25" fill="#f43f5e">
      <animate attributeName="fill" values="#f43f5e;#ec4899;#f43f5e" dur="3s" repeatCount="indefinite"/>
    </rect>
    <polygon points="39,16 39,34 55,25" fill="#ffffff"/>
  </g>
</svg>